# ── 部署硬约束：**必须单进程** ────────────────────────────────────────────────
#
# 不要给本服务加 `deploy.replicas` / `scale`，也不要在同一份 SQLite 数据目录上
# 起第二个容器。iCloud 取号的互斥是 `services/icloud/_locks.py` 里的
# **进程内** `threading.RLock` —— 两个进程各持自己那把锁，谁也挡不住谁，
# 于是会领到**同一个隐私邮箱**，两边注册都失败且日志里看不出原因。
#
# 详见 docs/MAINTENANCE.md §1.6「部署约束：必须单进程」。
# 要扩进程，先把取号换成跨进程原语（`icloud_alias_repository.update_where`
# 的条件更新），再考虑多副本。
#
services:
  app:
    # 默认从 GHCR 拉已发布镜像（公开包，匿名可拉）：
    #   docker compose pull && docker compose up -d
    # 想自己构建就 `docker compose up -d --build`（会忽略 image，直接用下面的 build）。
    # 换版本用 APP_IMAGE=ghcr.io/ifuzyi/auto-register:0.1 docker compose up -d
    image: ${APP_IMAGE:-ghcr.io/ifuzyi/auto-register:0.1.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 基础镜像可覆盖：受限网络（Docker Hub 被墙等）时换成可达的镜像源，
        # 例 NODE_IMAGE=docker.m.daocloud.io/library/node:20-bookworm-slim
        NODE_IMAGE: ${NODE_IMAGE:-node:20-bookworm-slim}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        # 浏览器版本兜底值：正常情况下脚本读 camoufox 包自带的 browser-pin.json
        # （库升级自动带动浏览器升级）；这里仅在包不带 pin（开发版）时生效。
        CAMOUFOX_VERSION: ${CAMOUFOX_VERSION:-135.0.1}
        CAMOUFOX_RELEASE: ${CAMOUFOX_RELEASE:-beta.24}
    container_name: account-manager
    init: true
    restart: unless-stopped
    # .env 里的应用变量（OPENAI_* 等）注入容器；没建 .env 的机器照常启动。
    # 注意：environment 段的值优先于 .env（compose 规则），数据目录等以本文件为准。
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      APP_RELOAD: "0"
      APP_CONDA_ENV: docker
      APP_RUNTIME_DIR: /runtime
      # 数据目录（见 docs/DATA_DIRECTORY.md）；默认库与凭据密钥都在它下面，
      # 所以只需挂这一个卷，备份/迁移就是拷一个目录。
      DATA_DIR: /runtime
      # 必须落在挂载卷里，否则每次重建容器都会换密钥，库里的凭据全部作废
      CREDENTIAL_ENCRYPTION_KEY_FILE: /runtime/secrets/credential_key
      APP_ENABLE_SOLVER: "1"
      SOLVER_PORT: "8889"
      # 容器内必须绑 0.0.0.0（否则端口映射进不来），但对外只经下面那条
      # 127.0.0.1 映射暴露 —— solver 接口**没有鉴权**，绝不能直接对外。
      SOLVER_BIND_HOST: 0.0.0.0
      LOCAL_SOLVER_URL: http://127.0.0.1:8889
      SOLVER_BROWSER_TYPE: ${SOLVER_BROWSER_TYPE:-camoufox}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-}
    ports:
      # 端口可由 .env 覆盖；默认 8000 对外、Solver 只绑本机
      - "${APP_PORT_BIND:-8000}:8000"
      - "${SOLVER_PORT_BIND:-127.0.0.1:8889}:8889"
    volumes:
      # 一个卷装全部运行数据：默认库、平台分库、密钥、邮箱池、日志
      - ${APP_RUNTIME_BIND:-./data}:/runtime
    # 探豁免鉴权的端点（/api/auth/* 不走登录），设了面板密码也能过；
    # start_period 给建库/加载平台留时间，避免正常启动被误判 unhealthy。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/auth/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # 日志上限：长跑服务器上 json-file 不设限会撑爆磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # /dev/shm 给 Chromium/Camoufox：默认 64MB 会让浏览器渲染进程崩溃
    shm_size: "1gb"
    # 内存上限：浏览器（Camoufox + Chromium）是内存大户，泄漏或僵尸进程
    # 会一路吃满宿主机。设上限让内核 OOM killer 只杀这个容器，而不是
    # 拖垮整台机器。按并发调：每个浏览器上下文约 300-500MB。
    #
    # 用 `mem_limit`（非 Swarm 也生效）而不是 `deploy.resources.limits`
    # ——后者只在 `docker stack deploy` 下生效，普通 `docker compose up`
    # 会静默忽略，等于没设。
    mem_limit: ${APP_MEMORY_LIMIT:-4g}
    # 容器内进程数上限：防止浏览器子进程泄漏时把宿主 PID 表打满
    pids_limit: 4096
