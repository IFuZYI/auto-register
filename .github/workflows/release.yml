# 推 tag（v*）时自动：① 建 GitHub Release ② 构建并推 Docker 镜像到 GHCR。
#
# 为什么走 Actions 而不是本机：本机只有 SSH 推送权限，没有 GitHub API token，
# 建不了 Release 也推不了 GHCR。workflow 里的 `GITHUB_TOKEN` 由 Actions 自动
# 注入，天然具备 `contents: write`（建 Release）与 `packages: write`（推 GHCR）——
# 不需要任何人工凭据，也不需要把 token 存到仓库 secrets 里。
#
# 手动重跑：Actions 页面 → Release → Run workflow，填 tag（例如 v0.1.0）。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.1.0），必须已存在"
        required: true
        type: string

permissions:
  contents: write # 建 Release
  packages: write # 推 GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: 建 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整 tag 历史才能读 tag 消息

      - name: 解析版本号
        id: ver
        env:
          # 输入只经 env 传递，绝不插进 run 的字符串里（注入面）。
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${REF#refs/tags/}"
          fi
          # 白名单校验：只允许 v<数字>.<数字>.<数字>（可带 -后缀），
          # 否则直接失败 —— 后面会把它交给 gh，不能带任何元字符。
          if ! printf '%s' "$TAG" | grep -qxE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag 形状非法：$TAG（期望 v1.2.3 / v1.2.3-rc1）"
            exit 1
          fi
          # 必须真的存在，避免给一个不存在的 tag 建 Release
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || {
            echo "::error::tag 不存在：$TAG"
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "标签：$TAG"

      - name: 取 Release 说明
        env:
          # 来自上一步的**白名单校验过**的输出，不是原始输入。
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # 优先用版本库里的 notes 文件：它是版本控制的、可 review 的、也是
          # 确定性的。**不依赖 tag 对象** —— `actions/checkout` 在 CI 里拿到的是
          # 轻量 tag，`git tag --format='%(contents)'` 会静默回退成**提交信息**
          # （v0.1.0 首次发布实测踩到：Release 正文变成了 CI 那条提交的标题）。
          NOTES_FILE="docs/releases/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" /tmp/notes.md
            echo "用 $NOTES_FILE 作为 release notes"
          elif git tag -l --format='%(contents)' "$TAG" 2>/dev/null | grep -q .; then
            git tag -l --format='%(contents)' "$TAG" > /tmp/notes.md
            echo "用 tag 消息作为 release notes"
          else
            # 都没有就交给 gh 自动生成（按提交生成 changelog）
            : > /tmp/notes.md
            echo "没有 notes 来源，交给 --generate-notes"
          fi

      - name: 创建 Release（已存在则更新 notes）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # 诊断写进 job summary：公开仓库里 Summary 匿名可见，而日志要登录 ——
          # 这样没有 API token 也能拿到「到底发生了什么」。
          {
            echo "### Release 诊断"
            echo '```'
            echo "TAG=$TAG"
            echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
            echo "gh: $(gh --version 2>&1 | head -1)"
            echo "已有 releases:"
            gh release list --limit 10 2>&1 || true
            echo "API 查询（创建前）:"
            gh api "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | "\(.tag_name) draft=\(.draft)"' 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          code=$(curl -sS -o /tmp/rel.json -w '%{http_code}' -H "$AUTH" "$API/releases/tags/$TAG" || echo 000)
          echo "查已有 release：HTTP $code"
          if [ "$code" = "200" ]; then
            rc=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PATCH -H "$AUTH" \
                 -H 'Accept: application/vnd.github+json' \
                 -d "$(python3 -c 'import json,sys;print(json.dumps({"body":open("/tmp/notes.md").read()}))')" \
                 "$API/releases/tags/$TAG" || echo 000)
          else
            rc=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST -H "$AUTH" \
                 -H 'Accept: application/vnd.github+json' \
                 -d "$(python3 -c 'import json,os;print(json.dumps({"tag_name":os.environ["TAG"],"name":os.environ["TAG"],"body":open("/tmp/notes.md").read(),"draft":False,"prerelease":False}))')" \
                 "$API/releases" || echo 000)
          fi
          echo "创建/更新 release：HTTP $rc"
          if [ "$rc" != "201" ] && [ "$rc" != "200" ]; then
            # ::error:: 会出现在 run 的 Annotations 里 —— 公开仓库匿名可见，
            # 而日志与 step summary 都要登录。这样没有 API token 也能看到真实原因。
            echo "::error::release API 返回 HTTP $rc：$(head -c 500 /tmp/resp.json)"
            exit 1
          fi
          head -c 300 /tmp/resp.json
          {
            echo "创建/更新后的 API 查询:"
            echo '```'
            gh api "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | "\(.tag_name) draft=\(.draft) notes=\(.body|length)"' 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: 构建并推送镜像到 GHCR
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          TAG="${REF#refs/tags/}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Actions 自动注入的 token，具备 packages:write（见文件顶部 permissions）
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 浏览器下载是构建里最慢的一步，缓存能省掉十几分钟
          cache-from: type=gha
          cache-to: type=gha,mode=max
