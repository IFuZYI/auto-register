[pytest]
# 只收集 tests/。
#
# 为什么必须有这条（2026-11-04 全量检测实测）：仓库此前**没有任何 pytest 配置**，
# 于是从仓库根裸跑 `pytest` 会递归走进
#   .worktrees/dev/tests、.worktrees/refactor/tests、
#   .worktrees/refactor-zero-behavior-change/tests、reference/panel/camoufox/tests/
# 这些目录里有与 tests/ **同名**的测试文件（quality_guard_test、
# session_rotator_test、test_proxy_pool …），pytest 报 `import file mismatch`：
#
#   pytest          → 2969 collected + 311 ERROR
#   pytest tests/   → 3514 collected + 0 error
#
# 文档与门禁用的都是 `pytest tests/`，所以正式流程没受影响；但任何裸跑
# `pytest` 的人（或工具、或代代理）会看到 311 个错误与掉了一半的收集数，
# 极容易误判成「项目烂了」—— 本轮独立审查里就有一位这么被绊了一下。
testpaths = tests

# 双保险：即使有人显式传了仓库根，也别去踩那些树。
norecursedirs = .git .venv .worktrees reference node_modules dist build
